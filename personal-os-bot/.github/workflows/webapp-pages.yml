# Publishes webapp/ (the Telegram Mini App) to GitHub Pages for free.
# Works once this folder is its own repository: Settings -> Pages -> Source: GitHub Actions.
# The page is static; your data travels inside the link (#d=...) and is never sent to GitHub.
name: Mini App (GitHub Pages)

on:
  push:
    branches: ["main"]
    paths: ["webapp/**", ".github/workflows/webapp-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp
      - id: deployment
        uses: actions/deploy-pages@v4
